<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg"> <!-- Definisi panah --> <defs> <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" fill="#000" /> </marker> </defs> <!-- Kotak dan teks --> <!-- Customer --> <rect x="50" y="50" width="120" height="40" fill="#e1f5fe" stroke="#000" stroke-width="2"/> <text x="110" y="75" text-anchor="middle" font-size="12">Customer</text> <text x="110" y="90" text-anchor="middle" font-size="10">Hubungi sales</text> <!-- CRM --> <rect x="200" y="50" width="120" height="60" fill="#f3e5f5" stroke="#000" stroke-width="2"/> <text x="260" y="70" text-anchor="middle" font-size="12">CRM</text> <text x="260" y="85" text-anchor="middle" font-size="10">Buat Sales Order</text> <text x="260" y="100" text-anchor="middle" font-size="10">Cek stok via Inv</text> <!-- Inventory --> <rect x="350" y="50" width="120" height="40" fill="#e8f5e8" stroke="#000" stroke-width="2"/> <text x="410" y="70" text-anchor="middle" font-size="12">Inventory</text> <text x="410" y="85" text-anchor="middle" font-size="10">Cek ketersediaan</text> <!-- Decision --> <diamond x="500" y="50" width="120" height="40" fill="#fff3e0" stroke="#000" stroke-width="2"/> <text x="560" y="70" text-anchor="middle" font-size="12">Decision</text> <text x="560" y="85" text-anchor="middle" font-size="10">Stok cukup?</text> <!-- Finance (Ya) --> <rect x="650" y="20" width="120" height="40" fill="#fce4ec" stroke="#000" stroke-width="2"/> <text x="710" y="40" text-anchor="middle" font-size="12">Finance</text> <text x="710" y="55" text-anchor="middle" font-size="10">Proses penagihan</text> <!-- Manufacturing (Tidak) --> <rect x="500" y="120" width="120" height="60" fill="#f1f8e9" stroke="#000" stroke-width="2"/> <text x="560" y="140" text-anchor="middle" font-size="12">Manufacturing</text> <text x="560" y="155" text-anchor="middle" font-size="10">Buat Prod Plan</text> <text x="560" y="170" text-anchor="middle" font-size="10">Work Order, MRP</text> <!-- HRM --> <rect x="350" y="200" width="120" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/> <text x="410" y="220" text-anchor="middle" font-size="12">HRM</text> <text x="410" y="235" text-anchor="middle" font-size="10">Alokasi karyawan</text> <!-- Manufacturing Eksekusi --> <rect x="200" y="200" width="120" height="40" fill="#f1f8e9" stroke="#000" stroke-width="2"/> <text x="260" y="220" text-anchor="middle" font-size="12">Manufacturing</text> <text x="260" y="235" text-anchor="middle" font-size="10">Eksekusi produksi</text> <!-- Inventory (Masuk stok) --> <rect x="50" y="200" width="120" height="40" fill="#e8f5e8" stroke="#000" stroke-width="2"/> <text x="110" y="220" text-anchor="middle" font-size="12">Inventory</text> <text x="110" y="235" text-anchor="middle" font-size="10">Produk masuk stok</text> <!-- CRM Update --> <rect x="50" y="280" width="120" height="40" fill="#f3e5f5" stroke="#000" stroke-width="2"/> <text x="110" y="300" text-anchor="middle" font-size="12">CRM</text> <text x="110" y="315" text-anchor="middle" font-size="10">Kirim notif, Update</text> <!-- Finance Akhir --> <rect x="200" y="280" width="120" height="40" fill="#fce4ec" stroke="#000" stroke-width="2"/> <text x="260" y="300" text-anchor="middle" font-size="12">Finance</text> <text x="260" y="315" text-anchor="middle" font-size="10">Rekam transaksi</text> <!-- Panah --> <line x1="170" y1="70" x2="200" y2="70" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="320" y1="70" x2="350" y2="70" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="470" y1="70" x2="500" y2="70" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="560" y1="90" x2="560" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- Tidak --> <line x1="560" y1="50" x2="650" y2="40" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <!-- Ya --> <line x1="560" y1="180" x2="470" y2="200" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="350" y1="220" x2="320" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="200" y1="220" x2="170" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="110" y1="240" x2="110" y2="280" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="170" y1="300" x2="200" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/> <line x1="710" y1="40" x2="710" y2="300" stroke="#000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/> <!-- Dari Finance Ya ke Akhir --> </svg>